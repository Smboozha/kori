<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КОРИ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #04040a;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", sans-serif;
    }
    #wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 0 60px rgba(245, 197, 66, 0.12);
      max-width: 100%;
      max-height: 100%;
    }
    @media (max-width: 980px) {
      canvas { zoom: 0.75; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="640"></canvas>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
